[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
dynamic = ["version"]
description = "Chat with a PDF: cited answers or an honest refusal, with measured retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "voyageai>=0.3",
    "pypdf>=5.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jiter>=0.5",
    "langgraph>=1.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
api = ["fastapi>=0.135", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.40", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
all = ["rag-document-assistant[chroma,pg,api,ui,dev]"]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rag_assistant.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rag_assistant/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Security"]
